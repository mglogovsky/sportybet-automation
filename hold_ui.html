<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FeedWire - Sporty Bet</title>
<style>
  /* ─────────────────────────────────────────────────────────────
     FEED WIRE identity, applied to the hold console — copper conductor
     on slate-black, mint reserved for LIVE. Tokens, type stacks and
     component rules are lifted from feed-wire.pro's stylesheet; every
     selector and every DOM hook the console's script uses is unchanged.
     ───────────────────────────────────────────────────────────── */
  :root{
    --ink:#0A0D11;
    --ink2:#0D1218;
    --panel:#121A22;
    --panel2:#172029;
    --line:#1E2831;
    --line2:#2B3742;
    --bone:#E9E6E0;
    --mute:#7F8B99;
    --mute2:#56616D;
    --copper:#E2703A;
    --copper2:#FF8C52;
    --copperm:#9C5230;
    --copperd:#6B3218;
    --live:#57D9A8;
    --lived:#234B3C;          /* live, dimmed to a border */
    --red:#E26D5A;
    --redd:#5A2E24;           /* red, dimmed to a border */
    --redbg:#1A1210;          /* red, dimmed to a wash */
    /* aliases — the console's script paints a few inline styles with the old names */
    --blue:var(--copper2);
    --green:var(--live);
    --amber:var(--copper);
    --amber2:var(--copper2);
    --dim:var(--mute);
    --faint:var(--mute2);
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0}
  html{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  body{
    background:var(--ink);
    color:var(--bone);
    font:14px/1.55 var(--sans);
    min-height:100vh;
  }
  :focus-visible{outline:2px solid var(--copper);outline-offset:3px;border-radius:2px}
  ::selection{background:rgba(226,112,58,.28)}

  /* ---- header — the site's sticky nav, shrunk to a console bar --------- */
  /* The bar wraps, exactly like the site's nav: a crowded state (pills +
     balance + stop) must grow the bar, never push controls off the edge. */
  header{display:flex;align-items:center;gap:6px 8px;padding:11px 13px;position:sticky;top:0;z-index:2;
    flex-wrap:wrap;
    background:rgba(10,13,17,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:8px;font:700 11px var(--mono);letter-spacing:.16em;
    text-transform:uppercase;color:var(--bone);white-space:nowrap}
  .brand em{font-style:normal;color:var(--copper)}
  .brand svg{display:block;flex:none}
  @media (max-width:520px){ .brand{display:none} }

  /* ---- pill — the site's live pill; the state machine recolours it ------ */
  .pill{display:inline-flex;align-items:center;gap:8px;font:500 10px/1 var(--mono);
    padding:7px 14px 7px 12px;border-radius:100px;letter-spacing:.15em;text-transform:uppercase;
    white-space:nowrap;flex:none;min-width:0;border:1px solid var(--line2);color:var(--mute)}
  .pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
  .pill:not(.idle) .dot{animation:beat 2.4s ease-out infinite}
  @keyframes beat{0%{box-shadow:0 0 0 0 rgba(87,217,168,.55)}70%{box-shadow:0 0 0 7px rgba(87,217,168,0)}100%{box-shadow:0 0 0 0 rgba(87,217,168,0)}}
  .pill.idle{color:var(--mute)}
  .pill.setup,.pill.arm,.pill.login{border-color:var(--copperm);color:var(--copper2)}
  .pill.ready,.pill.booked{border-color:var(--lived);color:var(--live)}
  .pill.holding,.pill.arming,.pill.settling,.pill.insta,.pill.warmup,.pill.stopping{border-color:var(--copperd);color:var(--copper)}
  .pill.paused,.pill.error,.pill.naked{border-color:var(--redd);color:var(--red)}
  .pill.cooldown{border-color:var(--line);color:var(--mute)}
  .pill.badge{flex:none}
  .pill.badge.open{border-color:var(--lived);color:var(--live)}
  .pill.badge.susp{border-color:var(--copperd);color:var(--copper)}
  .bal{margin-left:auto;font:600 13px var(--mono);letter-spacing:-.01em;white-space:nowrap;flex:none;
    font-variant-numeric:tabular-nums}
  .stop{flex:none;background:none;border:1px solid var(--redd);color:var(--red);border-radius:2px;
    padding:6px 10px;font:600 10px var(--mono);letter-spacing:.13em;text-transform:uppercase;
    cursor:pointer;white-space:nowrap;transition:background .18s,color .18s,border-color .18s}
  .stop:hover:not(:disabled){background:var(--red);border-color:var(--red);color:#170A03}
  .stop:disabled{opacity:.35;cursor:default}

  /* ---- layout ------------------------------------------------------------ */
  main{max-width:420px;margin:0 auto;padding:14px 14px 22px;display:flex;flex-direction:column;gap:10px;min-height:calc(100vh - 47px)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:18px}
  /* The hero card is lit from the wire, like the site's hero: one warm
     source low on the left, one breath of bone for ambient fill. */
  .hero{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;
    position:relative;overflow:hidden}
  .hero::before{content:"";position:absolute;inset:0;pointer-events:none;
    background:
      radial-gradient(115% 78% at 18% 112%, rgba(226,112,58,.14), transparent 60%),
      radial-gradient(100% 62% at 82% -8%, rgba(233,230,224,.04), transparent 58%)}
  .hero>*{position:relative}
  .hero h2{font:700 16px var(--mono);letter-spacing:-.02em;text-transform:uppercase}
  .sub{color:var(--mute);font-size:12.5px;max-width:34ch}
  .sub b{color:var(--bone);font-weight:600}
  .hint{color:var(--mute2);font:10.5px var(--mono);letter-spacing:.06em}
  .big{font-size:34px;line-height:1}
  .err{color:var(--red);font:12px var(--mono);background:var(--redbg);border:1px solid var(--redd);
    border-radius:4px;padding:9px 11px;width:100%;text-align:left;word-break:break-word}

  /* ---- target card — a board row with a copper price --------------------- */
  .target{width:100%;background:var(--ink2);border:1px solid var(--line);border-radius:4px;
    padding:12px 13px;text-align:left;display:flex;flex-direction:column;gap:2px;position:relative}
  .target.dashed{border-style:dashed;opacity:.7}
  .target .ev{font:700 13.5px var(--mono);padding-right:64px}
  .target .mk{color:var(--mute);font:11px var(--mono);letter-spacing:.04em}
  .target .odds{position:absolute;top:12px;right:12px;font:700 15px var(--mono);color:var(--copper2);
    background:rgba(226,112,58,.09);border:1px solid var(--copperd);border-radius:2px;padding:3px 8px;
    font-variant-numeric:tabular-nums}
  .target.pick{cursor:pointer;transition:border-color .18s,transform .1s}
  .target.pick:hover{border-color:var(--copper)}
  .target.pick:active{transform:scale(.985)}

  /* ---- steps -------------------------------------------------------------- */
  .steps{text-align:left;width:100%;display:flex;flex-direction:column;gap:7px}
  .step{display:flex;gap:10px;align-items:center;background:var(--ink2);border:1px solid var(--line);
    border-radius:4px;padding:10px 12px;font-size:12.5px;transition:opacity .2s}
  .step.done{opacity:.45}
  .step .n{font:700 10px var(--mono);border:1px solid var(--line2);border-radius:2px;
    padding:2px 7px;color:var(--copper2);flex:none}
  .step.done .n{color:var(--live);border-color:var(--lived)}
  .step.urgent{border-color:var(--redd);background:var(--redbg);color:#F0B9AC}
  .step.urgent .n{color:var(--red);border-color:var(--redd)}

  /* ---- big action-required banner — the ₦10 token bet must be unmissable --- */
  .bigwarn{width:100%;background:var(--redbg);border:2px solid var(--red);border-radius:4px;
    padding:16px 14px;text-align:center;display:flex;flex-direction:column;gap:6px;
    animation:warnpulse 1.6s ease-in-out infinite}
  .bigwarn .t{font:800 15px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--red)}
  .bigwarn .s{font:12px var(--sans);color:#F0B9AC}
  @keyframes warnpulse{0%,100%{box-shadow:0 0 0 0 rgba(226,109,90,.55)}50%{box-shadow:0 0 0 9px rgba(226,109,90,0)}}

  /* ---- timer / progress — the wire, running ------------------------------- */
  .timerwrap{display:flex;flex-direction:column;gap:2px;align-items:center}
  .timer{font:700 44px/1.05 var(--mono);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .tlabel{font:600 9px var(--mono);letter-spacing:.22em;text-transform:uppercase;color:var(--mute2)}
  .pbar{width:100%;height:2px;background:var(--line);overflow:hidden;position:relative}
  .pbar i{position:absolute;top:0;bottom:0;width:38%;
    background:linear-gradient(90deg,transparent,var(--copper),var(--copper2),transparent);
    animation:slide 1.25s ease-in-out infinite}
  @keyframes slide{0%{left:-38%}100%{left:100%}}
  .spin{display:inline-block;animation:sp 1s linear infinite;color:var(--copper2)}
  @keyframes sp{to{transform:rotate(360deg)}}

  /* ---- buttons — the site's .btn trio -------------------------------------- */
  .bigbtn{width:100%;border:1px solid transparent;border-radius:2px;padding:15px 24px;
    font:600 12.5px var(--mono);letter-spacing:.13em;text-transform:uppercase;
    cursor:pointer;transition:background .18s,border-color .18s,color .18s,transform .18s,opacity .15s}
  .bigbtn:active:not(:disabled){transform:translateY(1px)}
  .bigbtn.green{background:var(--copper);color:#170A03}
  .bigbtn.green:hover:not(:disabled){background:var(--copper2);transform:translateY(-1px)}
  .bigbtn.amber{background:none;border-color:var(--copper);color:var(--copper)}
  .bigbtn.amber:hover:not(:disabled){background:rgba(226,112,58,.08);border-color:var(--copper2);color:var(--copper2)}
  .bigbtn:disabled{opacity:.45;cursor:default}
  .bigbtn.ghost{background:none;border-color:var(--line2);color:var(--bone);
    padding:11px;font-size:12px}
  .bigbtn.ghost:hover:not(:disabled){border-color:var(--mute);background:rgba(255,255,255,.03)}

  /* ---- key-value panel — an instrument readout ------------------------------ */
  .panel{width:100%;background:var(--ink2);border:1px solid var(--line);border-radius:4px;
    padding:4px 13px}
  .kv{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
    font:12.5px var(--mono);width:100%;padding:7px 0;border-bottom:1px solid var(--line)}
  .kv:last-child{border-bottom:0}
  .kv span{color:var(--mute2);font-size:10px;letter-spacing:.16em;text-transform:uppercase}
  .kv b{font-weight:600;text-align:right;word-break:break-all;font-variant-numeric:tabular-nums}

  /* ---- chips / history — the site's roster squares --------------------------- */
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{font:10.5px var(--mono);letter-spacing:.04em;color:var(--mute);border:1px solid var(--line);
    border-radius:2px;padding:4px 10px;background:var(--ink2)}
  .chip b{color:var(--bone);font-weight:600}
  .chip .g{color:var(--live)} .chip .a{color:var(--copper)} .chip .r{color:var(--red)}

  /* ---- log — the console tape ------------------------------------------------- */
  #logwrap{display:flex;flex-direction:column;flex:1 1 auto;min-height:0;
    background:var(--ink2);border:1px solid var(--line);border-radius:4px;overflow:hidden}
  #logwrap.collapsed{flex:0 0 auto}
  #loghead{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;
    padding:8px 12px;font:600 10px var(--mono);letter-spacing:.16em;text-transform:uppercase;
    color:var(--mute2);cursor:pointer;text-align:left;user-select:none}
  #loghead::before{content:"▾";color:var(--copper);transition:transform .15s;font-size:11px}
  #logwrap.collapsed #loghead::before{transform:rotate(-90deg)}
  #loglast{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    font:10.5px var(--mono);letter-spacing:0;color:var(--mute);text-transform:none}
  #log{flex:1 1 auto;min-height:110px;overflow:auto;padding:4px 12px 10px;
    border-top:1px solid var(--line);
    font:11px/1.75 var(--mono);color:var(--mute);white-space:pre-wrap;
    scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
  #log div{border-bottom:1px solid var(--line);padding:1px 0}
  #log div:last-child{border-bottom:0}
  #logwrap.collapsed #log{display:none}
  #log::-webkit-scrollbar{width:6px}
  #log::-webkit-scrollbar-thumb{background:var(--line2);border-radius:3px}
  #log div:last-child{color:var(--bone)}
  #log .good{color:var(--live)} #log .bad{color:var(--red)} #log .warn{color:var(--copper2)}

  /* ---- form — instrument labels over sunken fields ------------------------------ */
  label{display:block;font:600 10px var(--mono);letter-spacing:.16em;text-transform:uppercase;
    color:var(--mute2);margin:9px 0 4px}
  input,select{width:100%;background:var(--ink2);border:1px solid var(--line);color:var(--bone);
    border-radius:2px;padding:9px 10px;font:13px var(--mono);outline:none;
    transition:border-color .18s}
  input:focus,select:focus{border-color:var(--copper)}
  input::placeholder{color:var(--mute2)}

  /* ---- license overlays + pill ------------------------------------------------ */
  .overlay{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;
    background:rgba(10,13,17,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:18px}
  .overlay.on{display:flex}
  .overlay .card{width:100%;max-width:360px;text-align:center;display:flex;flex-direction:column;
    gap:12px;align-items:center}
  .pill.license{border-color:var(--lived);color:var(--live)}
  .pill.license.warn{border-color:var(--copperd);color:var(--copper)}
  .pill.license.locked{border-color:var(--redd);color:var(--red)}
</style>
</head>
<body>
<header>
  <div class="brand"><svg width="15" height="15" viewBox="0 0 48 48" aria-hidden="true"><g fill="none" stroke="#E2703A" stroke-width="4" stroke-linecap="round"><path d="M4 24h8"/><path d="M36 24h8"/><circle cx="24" cy="24" r="8.5"/></g><circle cx="24" cy="24" r="3.2" fill="#E2703A"/></svg>FEEDWIRE&nbsp;<em>SPORTY BET</em></div>
  <div class="pill idle" id="pill"><span class="dot"></span>idle</div>
  <div class="pill badge" id="instaPill" style="display:none" title="Live market status of the armed selection: OPEN = a bet verdicts instantly (INSTA possible); SUSPENDED = the server parks bets (hold window, INSTA off)"></div>
  <div class="pill license" id="licPill" style="display:none" title="License status (checked at startup and every 12 h against the license server)"></div>
  <div class="bal" id="bal">—</div>
  <button class="stop" id="stopBtn" disabled title="Finish the current round, cash out the mines hold, stop">■ STOP</button>
</header>

<main>
  <section class="card hero" id="hero"></section>
  <section class="chips" id="chips"></section>
  <section id="logwrap">
    <button id="loghead" type="button"><span>LOG</span><span id="loglast"></span></button>
    <div id="log"></div>
  </section>
  <section class="chips" id="history"></section>
</main>

<div class="overlay" id="keyOverlay">
  <div class="card">
    <div class="big">🔑</div>
    <h2 style="font-size:16px;font-weight:800">Enter your license key</h2>
    <div class="sub">you get the key from your provider — it is checked against the license server</div>
    <div style="width:100%;text-align:left">
      <label>LICENSE KEY</label>
      <input id="licKey" placeholder="SBET-XXXX-XXXX-XXXX" autocomplete="off" spellcheck="false">
    </div>
    <div class="err" id="licErr" style="display:none"></div>
    <button class="bigbtn green" id="licActivate" onclick="activateKey()">ACTIVATE</button>
  </div>
</div>

<div class="overlay" id="lockOverlay">
  <div class="card">
    <div class="big">🔒</div>
    <h2 style="font-size:16px;font-weight:800">License locked</h2>
    <div class="sub" id="lockMsg"></div>
    <button class="bigbtn green" id="lockRecheck" onclick="act('recheck_license')">↻&nbsp; RE-CHECK</button>
    <button class="bigbtn ghost" id="lockChangeKey" onclick="showKeyEntry()">✎&nbsp; CHANGE KEY</button>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
let S = { state: "idle", log: [] };
let profiles = null;
let tickTimer = null;
let lastHero = "";

// The IDLE profile pick must survive re-renders (profile list arriving, errors).
// Round settings are server-owned (DEFAULT_SETTINGS) — the UI never edits them.
const FORM_IDS = ["f_profile"];
function readForm() {
  const v = {};
  FORM_IDS.forEach(id => { const el = document.getElementById(id); if (el) v[id] = el.value; });
  return v;
}
function writeForm(v) {
  FORM_IDS.forEach(id => { const el = document.getElementById(id); if (el && v[id] != null) el.value = v[id]; });
}

const fmt = n => (n == null ? "—" : "₦ " + Number(n).toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2}));

async function act(action, extra={}) {
  try {
    await fetch("/api/action", {method:"POST", headers:{"content-type":"application/json"},
                                body: JSON.stringify({action, ...extra})});
  } catch(e) {}
  setTimeout(poll, 150);
}

// Disable on click so a double-click can't queue a duplicate action (the next
// state render re-enables it).
function btn(el, action) { el.disabled = true; act(action); }

// Picker card: dim immediately, send the pick with the selection's identity.
function pickSel(el, data) { el.style.opacity = .5; act("pick", data); }

async function poll() {
  try {
    const r = await fetch("/api/state");
    S = await r.json();
    render();
  } catch(e) {}
}

async function loadProfiles() {
  try {
    const r = await fetch("/api/profiles");
    const j = await r.json();
    profiles = j.ok ? j.profiles : [];
    if (S.state === "idle") render();
    if (!j.ok) $("#hero").insertAdjacentHTML("beforeend", `<div class="err">${j.error||"AdsPower not reachable"}</div>`);
  } catch(e) { profiles = []; }
}

function chips() {
  const c = [];
  const live = !["idle","setup","error"].includes(S.state); // market chips are stale off-session
  if (S.key_expires_at && S.now) c.push(`key <b>${Math.max(0,(S.key_expires_at - S.now)/60).toFixed(0)} min</b>`);
  if (S.mines_ok) c.push(`mines <b>✓</b>`);
  if (S.cycle) c.push(`cycle <b>${S.cycle}</b>`);
  if (S.round_no) c.push(`round <b>${S.round_no}</b>`);
  if (S.mines_stake) c.push(`hold <b>₦${S.mines_stake}</b>`);
  if (live && S.suspended) c.push(`<b class="r">SUSPENDED</b>`);
  const ms = S.market_status;
  if (live && ms === 0) c.push(`<b class="g">OPEN · instant</b>`);
  else if (live && (ms === 1 || ms === 2)) c.push(`<b class="a">SUSPENDED · hold window</b>`);
  $("#chips").innerHTML = c.map(x => `<div class="chip">${x}</div>`).join("");
  const h = (S.history || []).slice(-14).reverse();
  $("#history").innerHTML = h.map(x => {
    const cls = x.vclass === "accepted" ? "g" : x.vclass === "starved" ? "" : "a";
    return `<div class="chip">#${x.cycle} ${Number(x.secs).toFixed(1)}s <b class="${cls}">${x.vclass}</b></div>`;
  }).join("");
}

function targetCard(t, dashed, note) {
  if (!t) return `<div class="target dashed"><div class="mk">listening for a slip selection…</div></div>`;
  return `<div class="target${dashed?" dashed":""}"><span class="odds">${t.odds ?? ""}</span>
    <div class="ev">${t.eventId ?? ""}</div><div class="mk">${t.market ?? ""} / ${t.outcome ?? ""}${note ? " · " + note : ""}</div></div>`;
}

function rearmBtn() {
  return `<button class="bigbtn ghost" ${S.stop_requested || S.rearm_pending ? "disabled" : ""} onclick="btn(this,'rearm')">↺&nbsp; CHANGE SELECTION</button>`;
}

function spinner(title, sub) {
  return `<div class="big spin" style="color:var(--blue)">◌</div><h2>${title}</h2>
    <div class="sub">${sub}</div><div class="pbar"><i></i></div>`;
}

// ---- settings (idle screen) -------------------------------------------------
function settingsBlock() {
  const c = S.config || {};
  return `
  <div style="width:100%;text-align:left;border-top:1px dashed var(--line);padding-top:10px;margin-top:4px">
    <button class="bigbtn ghost" type="button" onclick="document.getElementById('cfgPanel').style.display = document.getElementById('cfgPanel').style.display === 'none' ? '' : 'none'">⚙&nbsp; SETTINGS</button>
    <div id="cfgPanel" style="display:none">
      <label>ADSPOWER API BASE</label>
      <input id="c_adspower_api_base" placeholder="http://127.0.0.1:50325" value="${c.adspower_api_base || ""}">
      <label>ADSPOWER API KEY</label>
      <input id="c_adspower_api_token" placeholder="required by newer AdsPower versions" value="${c.adspower_api_token || ""}">
      <div class="hint">AdsPower → Settings → Local API → copy the API key. Needed when the app shows "Require api-key".</div>
      <label>UI PORT (needs restart)</label>
      <input id="c_ui_port" placeholder="8790" value="${c.ui_port_saved ?? ""}">
      <div class="hint">active port: ${c.ui_port ?? "—"}</div>
      <div class="err" id="cfgErr" style="display:none"></div>
      <button class="bigbtn amber" onclick="saveConfig()">SAVE SETTINGS</button>
      <div class="hint">saved to ${c.config_path || "user config file"} — restart the app for port changes</div>
    </div>
  </div>`;
}

async function saveConfig() {
  const v = id => (document.getElementById(id) || {}).value ?? "";
  const err = $("#cfgErr");
  err.style.display = "none"; err.textContent = "";
  try {
    const r = await fetch("/api/action", {method:"POST", headers:{"content-type":"application/json"},
      body: JSON.stringify({action:"save_config",
        adspower_api_base: v("c_adspower_api_base"),
        adspower_api_token: v("c_adspower_api_token"),
        ui_port: v("c_ui_port")})});
    const j = await r.json();
    if (!j.ok) { err.textContent = j.error || "save failed"; err.style.display = ""; }
    else if (j.restart_required) { err.textContent = "saved — restart the app for port changes"; err.style.display = ""; }
  } catch(e) { err.textContent = "local server not reachable"; err.style.display = ""; }
  setTimeout(poll, 150);
}

function hero() {
  const t = S.target;
  switch (S.state) {
  case "idle": {
    const opts = (profiles || []).map(p =>
      `<option value="${p.user_id}"${p.user_id === S.default_profile ? " selected" : ""}>${p.label}</option>`).join("");
    const st = S.settings || {};
    const g = k => st[k] == null ? "—" : (Number.isInteger(+st[k]) ? +st[k] : st[k]);
    return `
    <h2>FeedWire - Sporty Bet</h2>
    <div class="sub">pick a profile, press START — the rest is automatic</div>
    <div style="width:100%;text-align:left">
      <label>PROFILE</label>
      <select id="f_profile">${opts || `<option value="">(AdsPower not reachable)</option>`}</select>
    </div>
    <div class="hint">hold ₦${g("mines_stake")} · ${g("mines")} mine · desk ${g("desk_size")} · margin ₦${g("redeem_margin")} · min ₦${g("min_stake")} · delay ${g("cycle_delay")}s</div>
    <button class="bigbtn green" onclick="startSession()">▶&nbsp; START</button>
    ${S.error ? `<div class="err">${S.error}</div>` : ""}
    ${settingsBlock()}`;
  }
  case "setup":
    return spinner("Launching…", "starting the profile browser and connecting");
  case "login":
    return `<div class="big">🔑</div><h2>Log in to SportyBet</h2>
      <div class="sub">log in <b>in the AdsPower browser window</b>, then continue here</div>
      <button class="bigbtn green" onclick="btn(this,'continue')">CONTINUE&nbsp;→</button>
      <div class="hint">Mines connects once after this, then its tab closes</div>`;
  case "arm": {
    const needBet = S.need_bet;
    if (S.choices && S.choices.length > 1) {
      const cards = S.choices.map(c => `
        <div class="target pick" onclick='pickSel(this, ${JSON.stringify({eventId: c.eventId, marketId: c.marketId, outcomeId: c.outcomeId})})'>
          <span class="odds">${c.odds ?? ""}</span>
          <div class="ev">${c.eventId ?? ""}</div>
          <div class="mk">${c.market ?? ""} / ${c.outcome ?? ""}</div>
        </div>`).join("");
      return `
      <h2>Pick a selection</h2>
      <div class="sub">${S.choices.length} selections on the slip — tap the one to arm</div>
      ${cards}
      <div class="hint">the list follows your slip live</div>`;
    }
    return `
    <h2>Get ready</h2>
    ${needBet ? `<div class="bigwarn"><div class="t">⚠ ACTION NEEDED — PLACE A ₦10 BET</div>
      <div class="s">Place <b>any ₦10 bet on any match</b> in the AdsPower window — this refreshes your tokens.<br>
      After it books, delete it from the betslip as usual (the app also auto-clears the slip once tokens arrive).</div></div>` : ""}
    <div class="steps">
      <div class="step${t ? " done" : ""}"><span class="n">${t ? "✓" : "1"}</span> Add your bet to the betslip <b>in the AdsPower window</b></div>
      <div class="step${needBet ? " urgent" : " done"}"><span class="n">${needBet ? "!" : "✓"}</span> ${needBet ? "Place any ₦10 bet on any match — this refreshes your tokens" : "No manual bet needed — tokens valid"}</div>
    </div>
    ${targetCard(t, true, "listening…")}
    ${S.suspended ? `<div class="err">⚠ the slip shows this market as SUSPENDED — pick another selection</div>` : ""}
    <div class="hint">the card follows your slip live — arms when stable 2 s</div>`;
  }
  case "ready": {
    const ms = S.market_status;
    const open = ms === 0, susp = ms === 1 || ms === 2;
    const msLine = ms == null ? `<span style="color:var(--dim)">reading live market status…</span>`
      : open ? `<b style="color:var(--green)">OPEN — verdicts INSTANTLY</b>`
      : susp ? `<b style="color:var(--amber)">SUSPENDED — hold window live</b>`
      : `<b>status ${ms}</b>`;
    // UI shows ONLY Instabet now (owner request 2026-08-28): FIRE HOLD's
    // logic and the 'begin' action stay fully intact server-side — the button
    // is just not rendered.
    const instaBtn = open
      ? `<button class="bigbtn green" onclick="btn(this,'insta')">⚡&nbsp; INSTABET ${fmt(S.balance)}</button>`
      : `<button class="bigbtn ghost" disabled>⚡&nbsp; INSTABET — unlocks when market opens</button>`;
    // const holdBtn = ... (hidden — FIRE HOLD not shown in UI; logic intact)
    const holdBtn = "";
    return `
    <h2>Target armed</h2>
    ${targetCard(t, false)}
    ${S.suspended ? `<div class="err">⚠ market SUSPENDED in the slip — change selection</div>` : ""}
    <div class="panel">
      <div class="kv"><span>BALANCE</span><b>${fmt(S.balance)}</b></div>
      <div class="kv"><span>MARKET</span>${msLine}</div>
    </div>
    ${instaBtn}
    <button class="bigbtn ghost" onclick="btn(this,'rearm')">↺&nbsp; CHANGE SELECTION</button>
    <div class="hint">${open ? "market open: INSTABET verdicts immediately"
      : susp ? "market suspended: INSTABET unlocks when it re-opens"
      : "INSTABET unlocks when the market opens"}</div>`;
  }
  case "insta":
    return `<div class="timerwrap"><div class="timer" id="tm">0.0s</div><div class="tlabel">ELAPSED</div></div>
      <div class="sub">INSTA BET ${fmt(S.stake)} fired — the verdict lands instantly…</div>
      <div class="pbar"><i></i></div>`;
  case "arming":
    return `<div class="timerwrap"><div class="timer" id="tm">0.0s</div><div class="tlabel">ELAPSED</div></div>
      <div class="sub">BET ${fmt(S.stake)} fired — arming the mines hold…</div>
      <div class="pbar"><i></i></div>
      ${rearmBtn()}`;
  case "warmup":
    return `<div class="timerwrap"><div class="timer" id="tm">0.0s</div><div class="tlabel">ELAPSED</div></div>
      <div class="sub">warm-up bet ${fmt(S.stake)} in flight — consuming the instant first-order window</div>
      <div class="pbar"><i></i></div>
      ${rearmBtn()}`;
  case "holding": {
    const hold = S.holding !== false;
    return `
    <div class="timerwrap"><div class="timer" id="tm">0.0s</div><div class="tlabel">ELAPSED</div></div>
    <div class="sub">BET ${fmt(S.stake)} in flight · ${hold ? `mines holding ₦${S.mines_stake ?? "?"} (cell ${S.cell ?? "?"} safe)` : "mines round played out"}</div>
    <button class="bigbtn amber" ${S.stop_requested || !hold ? "disabled" : ""} onclick="btn(this,'redeem')">⬇&nbsp; CASH OUT &amp; SETTLE BET</button>
    ${rearmBtn()}
    <div class="hint">${S.stop_requested ? "stopping — this round will play out" : S.rearm_pending ? "changing selection — this round plays out, then back to the betslip" : "or do nothing — the bet starves (4200) and the loop repeats"}</div>`;
  }
  case "settling":
    return `<div class="timerwrap"><div class="timer" id="tm">0.0s</div><div class="tlabel">ELAPSED</div></div>
      <div class="sub">hold cashed out — waiting for the bet verdict…</div>
      <div class="pbar"><i></i></div>`;
  case "cooldown":
    return spinner("Cooldown…", "pacing the next fire — orders fired too soon after a verdict race the mines hold") + rearmBtn();
  case "naked": {
    const b = S.booked || {};
    return `
    <div class="big">🚨</div><h2 style="color:var(--red)">Naked accept</h2>
    <div class="sub">the bet booked WITHOUT the mines hold${b.cashed ? " — auto-cashed out to recover the stake" : ""}</div>
    <div class="panel">
      <div class="kv"><span>ORDER</span><b>${b.order ?? "—"}</b></div>
      <div class="kv"><span>STAKE</span><b>${b.stake ?? "—"}</b></div>
      <div class="kv"><span>POTENTIAL</span><b>${b.potential ?? "—"}</b></div>
      ${b.cashed ? `<div class="kv"><span>CASHOUT</span><b style="color:var(--green)">${b.cashed}</b></div>` : ""}
    </div>
    <button class="bigbtn green" onclick="btn(this,'rearm')">↻&nbsp; RE-ARM NEXT TARGET</button>`;
  }
  case "booked": {
    const b = S.booked || {};
    return `
    <div class="big">✅</div><h2>Bet booked${b.insta ? " · INSTA" : ""}</h2>
    <div class="panel">
      <div class="kv"><span>ORDER</span><b>${b.order ?? "—"}</b></div>
      <div class="kv"><span>STAKE</span><b>${b.stake ?? "—"}</b></div>
      <div class="kv"><span>POTENTIAL</span><b style="color:var(--green)">${b.potential ?? "—"}</b></div>
      ${b.cashed ? `<div class="kv"><span>CASHOUT</span><b style="color:var(--green)">${b.cashed}</b></div>` : ""}
    </div>
    <button class="bigbtn green" onclick="btn(this,'rearm')">↻&nbsp; RE-ARM NEXT TARGET</button>`;
  }
  case "paused": {
    const p = S.pause || {};
    return `
    <div class="big">⚠️</div><h2>Circuit breaker</h2>
    <div class="sub">${p.vclass === "no-window" ? "this event books bets INSTANTLY — no in-play window, the loop would go naked" : `${p.count ?? 3} consecutive '${p.vclass ?? "?"}' failures — the market may be dead/suspended`}</div>
    <button class="bigbtn amber" onclick="btn(this,'retry')">↻&nbsp; RETRY</button>
    <button class="bigbtn ghost" onclick="btn(this,'rearm')">✎&nbsp; CHANGE SELECTION</button>`;
  }
  case "stopping":
    return spinner("Stopping…", "finishing the current round — the mines hold will be cashed out");
  case "error":
    return `<div class="big">⛔</div><h2>Something broke</h2>
      <div class="err">${S.error || "unknown error"}</div>
      <button class="bigbtn green" onclick="btn(this,'reset')">↻&nbsp; BACK TO START</button>
      <div class="hint">fix the cause first — this returns to the start screen</div>`;
  }
  return `<div class="sub">…</div>`;
}

function render() {
  const p = $("#pill");
  p.className = "pill " + (S.state || "idle");
  p.innerHTML = '<span class="dot"></span>' + (S.state || "idle");
  // Persistent INSTA availability badge (live market status of the armed slip)
  const ip = $("#instaPill"), ms = S.market_status;
  const live = !["idle","setup","error"].includes(S.state); // stale off-session
  if (live && ms === 0) {
    ip.style.display = ""; ip.className = "pill badge open";
    ip.textContent = "⚡ INSTA READY";
  } else if (live && (ms === 1 || ms === 2)) {
    ip.style.display = ""; ip.className = "pill badge susp";
    ip.textContent = "INSTA OFF · SUSP";
  } else {
    ip.style.display = "none";
  }
  $("#bal").textContent = fmt(S.balance);
  renderLicense();
  $("#stopBtn").disabled = !(S.running && !S.stop_requested && !["idle","setup","error"].includes(S.state));
  // Rewrite the hero ONLY when what it shows actually changed — otherwise the
  // 1 Hz poll would clobber the IDLE form mid-typing.
  const heroKey = S.state === "idle"
    ? "idle|" + (profiles ? profiles.length : -1) + "|" + (S.error || "") + "|" + JSON.stringify(S.settings || {})
    : S.state + "|" + JSON.stringify([S.target, S.balance, S.stake_preview, S.booked,
                                      S.pause, S.holding, S.cell, S.stop_requested,
                                      S.need_bet, S.error, S.choices, S.suspended,
                                      S.market_status, S.stake, S.rearm_pending]);
  if (heroKey !== lastHero) {
    const preserving = (S.state === "idle" && lastHero.startsWith("idle"));
    const formVals = preserving ? readForm() : null;
    $("#hero").innerHTML = hero();
    if (formVals) writeForm(formVals);
    lastHero = heroKey;
  }
  chips();
  const lg = $("#log");
  lg.innerHTML = (S.log || []).map(l => {
    const esc = l.replace(/</g,"&lt;");
    let cls = "";
    if (/error|fail|broke/i.test(l)) cls = "bad";
    else if (/accepted|booked|✓|REDEEMED/i.test(l)) cls = "good";
    else if (/⚠|suspend|starv|naked/i.test(l)) cls = "warn";
    return `<div class="${cls}">${esc}</div>`;
  }).join("");
  lg.scrollTop = lg.scrollHeight;
  $("#loglast").textContent = (S.log || []).slice(-1)[0] || "no log lines yet";
  // local timer tick between polls
  if (tickTimer) { clearInterval(tickTimer); tickTimer = null; }
  if (["holding","arming","insta","warmup","settling"].includes(S.state) && S.fired_at && S.now) {
    const t0 = S.fired_at, skew = Date.now()/1000 - S.now;
    const el = $("#tm");
    if (el) tickTimer = setInterval(() => { el.textContent = (Date.now()/1000 - skew - t0).toFixed(1) + "s"; }, 100);
  }
}

function startSession() {
  const p = document.getElementById("f_profile");
  // Settings stay server-side; the UI only picks the profile.
  act("start", { profile: p ? p.value : "" });
}

// ---- license --------------------------------------------------------------
// One lock overlay, exactly two texts (v2 A2): definitive verdicts vs
// UNREACHABLE get different words and different buttons.
const LOCK_DEFINITIVE = "License expired or revoked — contact your provider";
const LOCK_NETWORK = "Can't reach the license server — check your connection";
let forceKeyEntry = false;  // set by [Change key] on the lock overlay

function showKeyEntry() {
  forceKeyEntry = true;
  renderLicense();
}

async function activateKey(inputId="licKey", errId="licErr") {
  const inp = document.getElementById(inputId), err = document.getElementById(errId);
  // Normalize client-side: keys are case-insensitive.
  const key = (inp.value || "").trim().toUpperCase();
  err.style.display = "none"; err.textContent = "";
  $("#licActivate").disabled = true;
  try {
    const r = await fetch("/api/action", {method:"POST", headers:{"content-type":"application/json"},
                                          body: JSON.stringify({action:"activate_key", key})});
    const j = await r.json();
    if (!j.ok) { err.textContent = j.error || "activation failed"; err.style.display = ""; }
    else forceKeyEntry = false;
  } catch(e) { err.textContent = "local server not reachable"; err.style.display = ""; }
  $("#licActivate").disabled = false;
  setTimeout(poll, 150);
}

function renderLicense() {
  const lic = S.license || {};
  const st = lic.status || "checking";
  // Header pill: 🟢 Nd left / 🟡 under 3 days / 🔒 locked.
  const lp = $("#licPill");
  if (st === "OK" && lic.seconds_left != null) {
    const days = Math.floor(lic.seconds_left / 86400);
    lp.style.display = "";
    lp.className = "pill license" + (days < 3 ? " warn" : "");
    lp.textContent = days < 3 ? "🟡 " + Math.max(0, (lic.seconds_left/3600)).toFixed(0) + "h left"
                              : "🟢 " + days + "d left";
  } else if (st.startsWith("locked")) {
    lp.style.display = ""; lp.className = "pill license locked"; lp.textContent = "🔒 locked";
  } else if (st === "needs_key") {
    lp.style.display = ""; lp.className = "pill license locked"; lp.textContent = "🔒 no key";
  } else {
    lp.style.display = "none"; // checking / offline-retry: stay quiet
  }
  // Key-entry overlay on first run, or when [Change key] asked for it.
  $("#keyOverlay").classList.toggle("on", st === "needs_key" || forceKeyEntry);
  // Locked overlay: full window, everything behind it disabled.
  const locked = st.startsWith("locked:");
  $("#lockOverlay").classList.toggle("on", locked && !forceKeyEntry);
  if (locked) {
    const verdict = st.slice("locked:".length);
    const network = verdict === "UNREACHABLE";
    $("#lockMsg").textContent = network ? LOCK_NETWORK : LOCK_DEFINITIVE;
    $("#lockRecheck").innerHTML = network ? "↻&nbsp; RETRY" : "↻&nbsp; RE-CHECK";
    $("#lockChangeKey").style.display = network ? "none" : "";
  }
}

$("#stopBtn").onclick = () => act("stop");
const logwrap = $("#logwrap");
try { if (localStorage.getItem("holdui.logCollapsed") === "1") logwrap.classList.add("collapsed"); } catch(e) {}
$("#loghead").onclick = () => {
  logwrap.classList.toggle("collapsed");
  try { localStorage.setItem("holdui.logCollapsed", logwrap.classList.contains("collapsed") ? "1" : "0"); } catch(e) {}
};
poll();
loadProfiles();
setInterval(poll, 1000);
</script>
